name: GongXueYun Auto CheckIn & Report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式: auto(全自动), report(仅周月报), clock(仅打卡)"
        required: false
        default: "auto"
      sign_type:
        description: "打卡类型: START(上班) 或 END(下班)"
        required: false
        default: ""
      force_checkin:
        description: "是否强制触发(测试验证码): true/false"
        required: false
        default: "false"
  schedule:
    # 下班打卡 + 多轮补签保底（代码内置判重：已打过则自动跳过，不会重复打卡）
    # 北京时间 18:30 / 19:00 / 19:30 / 20:00 / 20:30 共 5 次机会
    # 18:30 跑 auto（打卡+周报），其余 4 次只跑 clock（纯打卡重试，省钱省额度）
    # 目的：风控是间歇性的，多轮重试可提高成功率，同时便于观察风控持续时长
    - cron: "30 10 * * *"   # 18:30
    - cron: "0 11 * * *"    # 19:00
    - cron: "30 11 * * *"   # 19:30
    - cron: "0 12 * * *"    # 20:00
    - cron: "30 12 * * *"   # 20:30

concurrency:
  group: gxy-clock-${{ inputs.mode || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_TYPE: ${{ github.event_name == 'schedule' && 'END' || inputs.sign_type }}
          FORCE_CHECKIN: ${{ inputs.force_checkin }}
          PHONE: ${{ secrets.PHONE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PROVINCE: ${{ secrets.PROVINCE }}
          CITY: ${{ secrets.CITY }}
          AREA: ${{ secrets.AREA }}
          ADDRESS: ${{ secrets.ADDRESS }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          LATITUDE: ${{ secrets.LATITUDE }}
          DESCRIPTION: ${{ secrets.DESCRIPTION }}
          OUT_REGISTER_NO: ${{ secrets.OUT_REGISTER_NO }}
          SECRET: ${{ secrets.SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || secrets.SECRET }}
          SENDKEY: ${{ secrets.SENDKEY || secrets.SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SATURDAY_CHECKIN: ${{ secrets.SATURDAY_CHECKIN || 'true' }}
          REPORT_START_DATE: ${{ secrets.REPORT_START_DATE }}
          SURVEY_OPTION_INDEX: ${{ secrets.SURVEY_OPTION_INDEX || '0' }}
          AUTO_MAKEUP: ${{ secrets.AUTO_MAKEUP || 'true' }}
          MAKEUP_LOOKBACK_DAYS: ${{ secrets.MAKEUP_LOOKBACK_DAYS || '0' }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_API_URL: ${{ secrets.PROXY_API_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'deepseek' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          WEEK_MIN_WORDS: ${{ secrets.WEEK_MIN_WORDS || '300' }}
          MONTH_MIN_WORDS: ${{ secrets.MONTH_MIN_WORDS || '600' }}
        run: python gongxueyun_auto.py --mode ${{ inputs.mode || (github.event.schedule == '30 10 * * *' && 'auto' || 'clock') }}
